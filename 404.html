<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="robots" content="noindex">
    <title data-i18n="error404.title">404 | DARIO.exe</title>

    <link
        rel="icon"
        href="/assets/favicon/favicon.ico"
        sizes="any">
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/favicon/favicon-32x32.png">
    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/favicon/favicon-16x16.png">
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/favicon/apple-touch-icon.png">
        <link
        rel="manifest"
        href="/assets/favicon/site.webmanifest">

    <meta name="theme-color" content="#000000">

    <script src="/js/era-init.js?v=1.4.1"></script>
    <link rel="stylesheet" href="/css/global.css?v=1.4.0">
    <link rel="stylesheet" href="/css/css404.css?v=1.2.1">
    <link rel="stylesheet" href="/css/era-theme.css?v=1.4.3">
    <script src="/js/i18n.js?v=1.4.1" defer></script>
    <script src="/js/era-switcher.js?v=1.4.2" defer></script>
    <script src="/js/interaction-effects.js?v=1.4.0" defer></script>
</head>

<body class="error-page">
    <main class="error-terminal">
        <p class="error-status" data-i18n="error404.systemError">SYSTEM ERROR</p>
        <h1 class="error-code">404</h1>
        <p class="error-title" data-i18n="error404.pageNotFound">PAGE_NOT_FOUND</p>
        <p class="error-message" data-i18n="error404.message">
            The requested resource could not be located.
            The system path may be invalid or no longer available.
        </p>
        <div
            class="error-details"
            aria-label="Error details"
            data-i18n-aria-label="error404.detailsAria">
            <p>
                <span data-i18n="error404.errorCode">ERROR_CODE:</span>
                404
            </p>

            <p>
                <span data-i18n="error404.status">STATUS:</span>
                <span data-i18n="error404.resourceNotFound">RESOURCE_NOT_FOUND</span>
            </p>

            <p>
                <span data-i18n="error404.action">ACTION:</span>
                <span data-i18n="error404.returnValue">RETURN_TO_SYSTEM</span>
            </p>
        </div>
        <a
            class="error-button"
            href="/"
            data-i18n="error404.returnButton"
            data-i18n-href="error404.returnHref">
            &gt; RETURN TO SYSTEM
        </a>
    </main>

</body>
</html>
