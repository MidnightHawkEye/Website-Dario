<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="robots" content="noindex">
    <title>404 | DARIO.exe</title>

    <link rel="icon" href="/assets/images/favicon.ico">
    <link rel="stylesheet" href="/css/global.css?v=1.2.0">
    <link rel="stylesheet" href="/css/404.css?v=1.2.0">
</head>

<body class="error-page">
    <main class="error-terminal">
        <p class="error-status">SYSTEM ERROR</p>
        <h1 class="error-code">404</h1>
        <p class="error-title">PAGE_NOT_FOUND</p>
        <p class="error-message">
            The requested resource could not be located.
            The system path may be invalid or no longer available.
        </p>
        <div class="error-details" aria-label="Error details">
            <p>
                <span>ERROR_CODE:</span>
                404
            </p>

            <p>
                <span>STATUS:</span>
                RESOURCE_NOT_FOUND
            </p>

            <p>
                <span>ACTION:</span>
                RETURN_TO_SYSTEM
            </p>
        </div>
        <a class="error-button" href="/">
            &gt; RETURN TO SYSTEM
        </a>
    </main>

</body>
</html>
